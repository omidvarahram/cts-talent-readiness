* { box-sizing: border-box; }
body { margin: 0; background: var(--page-bg); color: var(--text); font: 14px/1.5 var(--font-sans); }
button, input { font: inherit; }

.container { width: min(var(--content-width), calc(100% - 48px)); margin-inline: auto; }
.app-header { background: var(--navy); color: white; min-height: 64px; }

.muted { color: var(--text-muted); }

.icon { width: 24px; height: 24px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.shortcuts { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
.button { border: 1px solid var(--navy); background: var(--navy); color: white; border-radius: var(--radius); padding: 10px 18px; min-height: 44px; }
.button:hover { filter: brightness(.92); }
.button-secondary { background: white; color: var(--navy); border-color: var(--border); }

main { padding-block: 32px 48px; }
.section { margin-bottom: 36px; }
.section-heading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
.card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; min-width: 0; }
.card-feature { background: linear-gradient(125deg, #2c7cc4, var(--navy)); color: white; }
.card-feature a { color: var(--cyan); }
.metric { font-size: 32px; font-weight: 600; margin: 12px 0; }
.tile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.tile { display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 16px 20px; text-align: left; background: white; border: 1px solid #9691db; border-radius: var(--radius); color: var(--navy); }
.tile .icon { color: var(--purple-dark); }
.tile:hover { background: #e2fcfc; }
.tile[aria-pressed='true'] { background: #a1f0f1; border-color: #00828b; }
.badge { display: inline-block; border-radius: var(--radius-pill); padding: 4px 10px; font-size: 12px; font-weight: 600; background: var(--neutral-bg); color: var(--neutral-text); }
.badge-bench { background: var(--warning-bg); color: var(--warning-text); }
.badge-assigned, .badge-completed { background: var(--success-bg); color: var(--success-text); }
.badge-progress { background: #e6e4ff; color: var(--purple-dark); }
.progress-label { display: flex; justify-content: space-between; gap: 12px; margin-block: 16px 8px; }
progress { display: block; width: 100%; height: 10px; border: 0; border-radius: var(--radius-pill); overflow: hidden; background: var(--neutral-bg); accent-color: var(--purple-dark); }
progress::-webkit-progress-bar { background: var(--neutral-bg); }
progress::-webkit-progress-value { background: var(--purple-dark); }
progress::-moz-progress-bar { background: var(--purple-dark); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; text-align: left; }
th, td { padding: 14px 12px; border-bottom: 1px solid #dbe7f4; }
th { font-weight: 600; background: #f5f9ff; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
@media (max-width: 1000px) { .card-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } }
@media (max-width: 640px) { .container { width: calc(100% - 32px); } .card-grid { grid-template-columns: 1fr; } .hero { padding-block: 24px; } .app-header .container { align-items: flex-start; } .role-tabs { order: 3; width: 100%; } .card { padding: 20px; } }

 for(const p of db.people){p.skills=p.skills.map(s=>typeof s==='string'?{name:s,description:'',years:0,last_used:'',approval:'approved'}:{...s,name:s.title,years:s.years_of_experience,approval:s.approval_status,expertise:s.expertise,proof:s.evidence});
 const pending=p.skills.filter(s=>s.approval!=='approved');
 profiles[p.associate_id]={name:p.associate_name,phone:'',address:'',skills:pending,cv:null,image:null,complete:false};
 for(const s of pending){const req=db.approvalRequests?.find(r=>r.skill_id===s.skill_id);requests.push({id:req?.approval_request_id||s.skill_id,type:'skill',associate_id:p.associate_id,target:s.name,label:s.name,value:s,evidence:s.proof,status:s.approval});}}
}
resetData();
const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const person=()=>db.people.find(p=>p.associate_id===user);
const identity=id=>db.auth.find(a=>a.associate_id===id);
const roles=()=>identity(user)?.application_roles||[];
const title=x=>x.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
function profile(id=user){return profiles[id]??=( {name:db.people.find(p=>p.associate_id===id).associate_name,phone:'',address:'',skills:[],cv:null,image:null,complete:false});}
const btn=(label,action,secondary=false)=>`<button type="button" class="button ${secondary?'button-secondary':''}" data-action="${action}">${label}</button>`;
const field=(label,name,value='',readonly=false,type='text')=>`<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${readonly?'readonly':(['name','phone'].includes(name)?'required aria-required="true"':'')}>${['name','phone'].includes(name)?`<span class="field-error" id="error-${name}" aria-live="polite"></span>`:''}</label>`;
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3200);}
function saveLogin(){try{localStorage.setItem('talent-prototype-login',JSON.stringify({associate_id:user,expires:Date.now()+86400000}));}catch{}}
function clearLogin(){try{localStorage.removeItem('talent-prototype-login');}catch{}}

function logoutApp(){
 // Remove this application's storage only; never erase unrelated origin data.
 clearLogin();
 for(const key of ['localStorage','sessionStorage']){try{const storage=window[key];for(let i=storage.length-1;i>=0;i--){const name=storage.key(i);if(name&&(name.startsWith('talent-prototype-')||name.startsWith('talent-readiness-')))storage.removeItem(name);}}catch{}}
 const urls=new Set();
 function collect(value){if(!value||typeof value!=='object')return;for(const item of Object.values(value)){if(typeof item==='string'&&item.startsWith('blob:'))urls.add(item);else if(item&&typeof item==='object')collect(item);}}
 collect(profiles);collect(requests);for(const url of urls)URL.revokeObjectURL(url);
 resetData();user=null;screen='welcome';step=1;workspace='associate';search='';notice='';modal=null;showSkillForm=false;
}
function getLogin(){try{return JSON.parse(localStorage.getItem('talent-prototype-login'));}catch{return null;}}
function enter(id){showSkillForm=false;user=id;saveLogin();workspace=roles().includes('associate')?'associate':roles()[0];screen=profile().complete?'dashboard':'onboarding';step=profile().draftStep||1;notice='';render();}
function managerName(){return db.people.find(p=>p.associate_id===person().associate_manager)?.associate_name||'No manager assigned';}
function detailsFields(){let p=person(),v=profile();return `<div class="form-grid">${field('Full name *','name',v.name)}${field('Phone *','phone',v.phone,false,'tel')}${field('Registered email','email',p.associate_email,true)}${field('Associate ID','id',p.associate_id,true)}${field('Manager','manager',managerName(),true)}${field('Job title','job',title(p.associate_role),true)}${field('Location','location',p.location,true)}${field('Staffing status','staffing',title(p.associate_status.status),true)}</div><label class="field">Address *<textarea name="address" required aria-required="true">${esc(v.address)}</textarea><span class="field-error" id="error-address" aria-live="polite"></span></label><label class="field">Profile image (optional, PNG/JPEG, up to 5 MB)<input type="file" name="image" accept="image/png,image/jpeg"></label>${v.image?`<p class="small">Selected: ${esc(v.image.name)}</p>`:''}`;}
function skillsForm(){return `<form id="skill-form"><div class="form-grid"><label class="field">Search skill<input name="skill" list="skill-options" required placeholder="Start typing a skill"><datalist id="skill-options">${(db.skillCatalog||[]).map(s=>s.title).sort().map(s=>`<option value="${esc(s)}">`).join('')}</datalist></label><label class="field">Expertise<select name="expertise"><option>Beginner</option><option>Intermediate</option><option>Advanced</option><option>Expert</option></select></label><label class="field">Years of experience<input name="years" type="number" min="0" max="60" step="0.5" required></label><label class="field">Last used<input name="last_used" type="date" max="${new Date().toISOString().slice(0,10)}" required></label><label class="field">Evidence PDF (optional, up to 5 MB)<input type="file" name="proof" accept="application/pdf"></label></div><label class="field">Where have you used this skill?<textarea name="description" required placeholder="Describe a project and your contribution"></textarea></label><div class="actions"><button class="button">Submit skill for approval</button>${btn('Cancel','cancel-skill',true)}</div></form>`;}
function skillList(){
 const existing=person().skills.filter(s=>s.approval==='approved'&&!profile().skills.includes(s));
 const rows=[...existing,...profile().skills];
 return rows.length?`<div class="table-wrap skills-table-wrap" role="region" aria-label="Added skills table, scroll horizontally for all columns" tabindex="0"><table class="skills-table"><caption class="sr-only">Already added skills and approval status</caption><thead><tr><th scope="col">Title</th><th scope="col">Description</th><th scope="col">Years of experience</th><th scope="col">Last used</th><th scope="col">Status</th></tr></thead><tbody>${rows.map(s=>`<tr><th scope="row">${esc(s.name)}</th><td>${esc(s.description)}${s.proof?'<div>'+fileLink(s.proof)+'</div>':''}${s.reason?'<p class="notice error">'+esc(s.reason)+'</p>':''}</td><td>${esc(s.years)}</td><td>${esc(s.last_used||'Not provided')}</td><td><span class="badge ${s.approval==='approved'?'badge-completed':'badge-progress'}">${esc(title(s.approval))}</span></td></tr>`).join('')}</tbody></table></div><p class="small muted">Swipe the table to see every column.</p>`:'<p class="empty">No skills added yet.</p>';
}
function skillsSection(){return skillList()+`<button type="button" class="button add-skill-button" data-action="add-skill" aria-expanded="${showSkillForm}" aria-controls="new-skill-form">Add new skills</button>`+(showSkillForm?`<section id="new-skill-form" class="new-skill-form"><h3>Add a new skill</h3>${skillsForm()}</section>`:'');}
function fileLink(f){return f?.url?`<a class="file-link" href="${esc(f.url)}" target="_blank" rel="noopener">View ${esc(f.name)}</a>`:'';}
function cvForm(){let v=profile();return `<form id="cv-form"><label class="field">Upload CV (PDF, up to 5 MB)<input type="file" name="cv" accept="application/pdf"></label>${v.cv?`<p>${fileLink(v.cv)}</p>${btn('Remove CV','remove-cv',true)}`:'<p class="muted">No CV uploaded yet.</p>'}<label class="check"><input type="checkbox" name="skip" ${!v.cv?'checked':''}> I don’t have a CV yet</label><button class="button">${screen==='onboarding'?'Complete profile':'Save CV'}</button></form>`;}
function header(){return `<header class="app-header"><div class="container"><span class="wordmark">Talent Readiness</span>${screen==='dashboard'?`<nav class="role-tabs" aria-label="Workspaces">${roles().map(r=>`<button class="role-tab" aria-current="${workspace===r?'page':'false'}" data-role="${r}">${r==='associate'?'My profile':r==='manager'?'My team':'Admin'}</button>`).join('')}</nav>`:''}<div class="account-controls"><span class="avatar">${user?esc(profile().name.split(' ').map(x=>x[0]).slice(0,2).join('')):'TR'}</span>${screen==='dashboard'?`<button type="button" class="account-menu-toggle" data-action="toggle-account" aria-label="Account menu" aria-expanded="false" aria-controls="account-drawer">⋮</button><div class="account-drawer-layer" id="account-drawer-layer" inert><button type="button" class="account-drawer-backdrop" data-action="close-account" aria-label="Close account menu"></button><nav id="account-drawer" class="account-drawer-panel" aria-label="Account options"><h2>Account</h2><a href="https://onecognizant.cognizant.com/" target="_blank" rel="noopener noreferrer">One Cognizant<span class="sr-only"> (opens in a new tab)</span></a><button type="button" data-action="logout">Log out</button></nav></div>`:''}</div></div></header>`;}
function toolbar(){return `<details class="toolbar"><summary>Mobile prototype v1.8 · Demo controls</summary><div class="toolbar-content"><label>Demo person <select id="demo-person"><option value="">Choose a scenario</option>${db.people.map(p=>`<option value="${p.associate_id}" ${p.associate_id===user?'selected':''}>${esc(p.associate_name)} · ${identity(p.associate_id).application_roles.join(' + ')}</option>`).join('')}</select></label><span class="spacer"></span>${btn('Restart demo','reset',true)}${user?btn('Expire session','expire',true)+btn('Log out','logout',true):''}</div></details>`;}
function authScreen(){let returning=getLogin();return `<div class="shell auth-layout"><div class="intro"><p class="eyebrow">Your next opportunity starts here</p><h1>Your next opportunity<br>starts here.</h1><p class="tagline">Manage your profile, build new capabilities and stay ready for your next assignment.</p><div class="notice small">Demo only. SSO and biometrics are simulated. Never enter a real company password.</div></div><div class="form-card">${screen==='activate'?`<h2>Activate your account</h2><p class="muted">Use your registered company email and associate ID.</p><form id="activate-form">${field('Company email','email','',false,'email')}${field('Associate ID','id')}<p class="small">Try alex.morgan@example.com / 6100001, or select a demo person above.</p><button class="button">Continue to company portal</button></form>${btn('Back to login','welcome',true)}`:screen==='sso'?`<p class="eyebrow">Demo company portal · simulated WebView</p><h2>Company sign in</h2><p>${esc(person().associate_email)}</p><p class="muted">The company portal would verify your identity here. This prototype issues a fictional session with your application roles.</p><div class="notice">Roles: ${roles().join(', ')}<br>Status: ${title(person().associate_status.status)}</div>${btn('Simulate successful SSO','sso-success')}${btn('Simulate SSO error','sso-error',true)}${btn('Cancel','welcome',true)}`:screen==='paused'?`<h2>Your draft is saved</h2><p>You are still signed in. Resume setup whenever you are ready.</p><p class="muted">Step ${profile().draftStep||1} of 3 · Saved for this session. Reloading resets demo data.</p>${btn('Resume setup','resume')}`:`<h2>Welcome back</h2><p class="muted">Unlock your profile or continue with your company account.</p>${returning?btn('Unlock with biometrics','biometric'):''}<div class="actions">${btn('Continue with company account','activate')}${btn('First visit? Activate account','activate',true)}</div><p class="small muted" style="margin-top:24px">Choose a demo person to explore all role combinations.</p>`}${notice?`<div class="notice error" role="alert">${esc(notice)}</div>`:''}</div></div>`;}
function onboarding(){return `<main class="shell"><div class="section-heading"><div><p class="eyebrow">Let’s get you ready</p><h1>Complete your profile</h1></div>${btn('Save and exit','save-exit',true)}</div><ol class="steps">${['Personal details','Skills','CV and review'].map((s,i)=>`<li class="${step===i+1?'active':step>i+1?'done':''}" ${step===i+1?'aria-current="step"':''}>${i+1}. ${s}</li>`).join('')}</ol><div class="form-card">${step===1?`<h2 class="subheading">Personal details</h2><form id="details-form" novalidate><p class="small muted">* Required fields</p>${detailsFields()}<button class="button">Continue</button></form>`:step===2?`<h2>Skills and experience</h2><p class="muted">Add skills now, or continue and add them later. New skills need manager approval.</p>${skillsSection()}<div class="actions">${btn('Back','back',true)}${btn('Continue','next')}</div>`:`<h2>CV and review</h2><div class="notice">${esc(profile().name)} · ${esc(person().associate_email)}<br>${profile().skills.length} skill submissions · ${title(person().associate_status.status)}</div>${cvForm()}<div class="actions">${btn('Back','back',true)}</div>`}</div></main>`;}
function taskCards(){let list=db.tasks.filter(t=>t.associate_id===user);return list.length?list.map(t=>{let pending=requests.find(r=>r.type==='progress'&&r.target===t.learning_assignment_id&&r.status==='pending');return `<article class="card"><div class="row"><h3>${esc(t.subject)}</h3><span class="badge ${t.status==='completed'?'badge-completed':'badge-progress'}">${title(t.status)}</span></div><p class="small muted">Due ${t.date_due}</p><div class="progress-label"><span>Approved progress</span><strong>${t.status_percentage}%</strong></div><progress max="100" value="${t.status_percentage}" aria-label="${esc(t.subject)} approved progress">${t.status_percentage}%</progress>${pending?`<div class="notice">Requested: ${pending.value}% · Pending manager approval</div>`:`<div class="actions"><button class="button button-secondary" data-task="${t.learning_assignment_id}">Update progress</button></div>`}</article>`;}).join(''):'<div class="card empty">No learning assignments yet.</div>';}
function dashboard(){return `<section class="hero"><div class="container"><div class="row"><div><p class="eyebrow">${title(workspace)} workspace</p><h1>Welcome ${esc(profile().name.split(' ')[0])}!</h1><span class="badge ${person().associate_status.status==='on_bench'?'badge-bench':'badge-assigned'}">${title(person().associate_status.status)}</span></div><span class="pill">${esc(person().location)} · ${esc(person().associate_id)}</span></div></div></section><main class="shell">${workspace==='associate'?associateDashboard():workspace==='manager'?managerDashboard():adminDashboard()}</main>`;}
function associateDashboard(){return `<div class="columns section"><section class="card"><h2 class="subheading">Your profile</h2><form id="details-form" novalidate><p class="small muted">* Required fields</p>${detailsFields()}<button class="button">Save personal details</button></form></section><div class="stack"><section class="card"><h2 class="subheading">Your CV</h2>${cvForm()}</section><section class="card"><h2>Skills and experience</h2>${skillsSection()}</section></div></div><section><div class="section-heading"><h2>Learning assignments</h2><span class="small muted">Progress changes need manager approval</span></div><div class="card-grid">${taskCards()}</div></section>`;}
function managerDashboard(){let team=db.people.filter(p=>p.associate_manager===user);let inbox=requests.filter(r=>r.status==='pending'&&team.some(p=>p.associate_id===r.associate_id));return `<section class="section"><div class="section-heading"><h2>Approval inbox</h2><span class="badge">${inbox.length} pending</span></div><div class="stack">${inbox.length?inbox.map(r=>`<article class="card"><div class="row"><h3>${esc(db.people.find(p=>p.associate_id===r.associate_id).associate_name)}</h3><span class="badge badge-progress">${r.type==='skill'?'Skill verification':'Learning progress'}</span></div><p>${esc(r.label)}</p><p>${r.type==='progress'?`Approved: ${db.tasks.find(t=>t.learning_assignment_id===r.target).status_percentage}% · Requested: ${r.value}%`:`${esc(r.value.expertise)} · ${r.value.years} years · ${esc(r.value.description)}`}</p>${r.evidence?fileLink(r.evidence):''}<div class="actions"><button class="button" data-approve="${r.id}">Approve</button><button class="button button-secondary" data-reject="${r.id}">Reject</button></div></article>`).join(''):'<div class="card empty">No pending requests from your direct reports. Switch to a team member, submit a change, then return here.</div>'}</div></section><section class="card"><h2>Find a team member</h2><label class="field">Search by name or associate ID<input id="team-search" value="${esc(search)}" placeholder="Name or ID"></label><div id="team-results">${teamResults(team)}</div></section>`;}
function teamResults(team){return team.filter(p=>(p.associate_name+' '+p.associate_id).toLowerCase().includes(search.toLowerCase())).map(p=>`<div class="skill-row row"><div><strong>${esc(p.associate_name)}</strong><div class="small muted">${p.associate_id} · ${title(p.associate_role)}</div></div><button class="button button-secondary" data-assign="${p.associate_id}">Assign learning</button></div>`).join('')||'<p class="empty">No matching direct reports.</p>';}
function adminDashboard(){return `<section class="card"><h2>Manage application roles</h2><p class="muted">Search an associate, then select their permitted workspaces.</p><label class="field">Name or organisation ID<input id="admin-search" value="${esc(search)}"></label><div id="admin-results">${adminResults()}</div></section>`;}
function adminResults(){return db.people.filter(p=>(p.associate_name+' '+p.associate_id).toLowerCase().includes(search.toLowerCase())).map(p=>`<div class="skill-row row"><div><strong>${esc(p.associate_name)}</strong><div class="small muted">${p.associate_id} · ${identity(p.associate_id).application_roles.join(', ')}</div></div><button class="button button-secondary" data-editroles="${p.associate_id}">Edit roles</button></div>`).join('')||'<p class="empty">No matching associates.</p>';}
function modalContent(){if(!modal)return '';let content='';if(modal.type==='bio')content=`<h2>Unlock Talent Readiness</h2><p class="muted">Simulated device biometric prompt</p><div class="biometric" aria-hidden="true">◎</div>${btn('Simulate biometric success','bio-success')}${btn('Simulate failure','bio-failure',true)}`;
if(modal.type==='progress'){let t=db.tasks.find(x=>x.learning_assignment_id===modal.id);content=`<h2>Update progress</h2><p>${esc(t.subject)}</p><form id="progress-form"><label class="field">Proposed progress (%)<input name="progress" type="number" min="0" max="100" value="${t.status_percentage}" required></label><label class="field">Completion certificate PDF (required for 100% when applicable)<input name="proof" type="file" accept="application/pdf"></label><button class="button">Send for approval</button></form>`;}
if(modal.type==='reject')content=`<h2>Reject request</h2><form id="reject-form"><label class="field">Reason<textarea name="reason" required></textarea></label><button class="button">Reject with feedback</button></form>`;
if(modal.type==='assign'){let p=db.people.find(p=>p.associate_id===modal.id);content=`<h2>Assign learning</h2><p>${esc(p.associate_name)}</p><form id="assign-form"><label class="field">Learning<select name="code">${db.learning.map(l=>`<option value="${l.learning_code}">${esc(l.subject)} · ${l.seniority_level}</option>`).join('')}</select></label><label class="field">Due date<input name="due" type="date" min="${new Date().toISOString().slice(0,10)}" required></label><label class="field">Instructions<textarea name="description"></textarea></label><button class="button">Assign learning</button></form>`;}
if(modal.type==='roles')content=`<h2>Edit application roles</h2><p>${esc(db.people.find(p=>p.associate_id===modal.id).associate_name)}</p><form id="roles-form">${['associate','manager','admin'].map(r=>`<label class="check"><input type="checkbox" name="roles" value="${r}" ${identity(modal.id).application_roles.includes(r)?'checked':''}>${title(r)}</label>`).join('')}<button class="button">Save roles</button></form>`;
return `<div class="dialog-backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-label="${esc(modal.type)}"><div class="row"><span class="eyebrow">Prototype</span>${btn('Close','close',true)}</div>${content}<div id="modal-error" role="alert"></div></section></div>`;}

function positionAccountDrawer(){const bar=document.querySelector('.app-header');const layer=document.getElementById('account-drawer-layer');if(bar&&layer)layer.style.top=Math.max(0,bar.getBoundingClientRect().bottom)+'px';}
function toggleAccountDrawer(force){const layer=document.getElementById('account-drawer-layer');const toggle=document.querySelector('.account-menu-toggle');if(!layer||!toggle)return;const open=force??!layer.classList.contains('is-open');positionAccountDrawer();layer.classList.toggle('is-open',open);layer.inert=!open;toggle.setAttribute('aria-expanded',String(open));if(!open)toggle.focus();}
function render(){document.getElementById('app').innerHTML=toolbar()+header()+(screen==='dashboard'?dashboard():screen==='onboarding'?onboarding():authScreen())+modalContent();if(modal)setTimeout(()=>$('.dialog input, .dialog textarea, .dialog button')?.focus(),0);}
function upload(file,pdf=true){if(!file?.size)return null;if(file.size>5*1024*1024)throw Error('Choose a file smaller than 5 MB.');if(pdf?!/\.pdf$/i.test(file.name):!/(\.png|\.jpe?g)$/i.test(file.name))throw Error(pdf?'Choose a PDF file.':'Choose a PNG or JPEG image.');return {name:file.name,url:URL.createObjectURL(file)};}

function saveDetailsDraft(form){
  if(!form)return;
  const data=new FormData(form);
  const image=upload(data.get('image'),false);
  Object.assign(profile(),{name:String(data.get('name')||'').trim(),phone:String(data.get('phone')||'').trim(),address:String(data.get('address')||'').trim()});
  if(image)profile().image=image;
}
function validateDetails(form,data){
  form.querySelector('.form-error')?.remove();
  const errors=[];
  for(const [name,label] of [['name','Name'],['phone','Phone'],['address','Address']]){
    const control=form.elements.namedItem(name), slot=form.querySelector('#error-'+name);
    const missing=!String(data.get(name)||'').trim();
    control.setAttribute('aria-invalid',String(missing));
    if(slot)slot.textContent=missing?label+' is required.':'';
    if(missing){control.setAttribute('aria-describedby','error-'+name);errors.push(control);}
    else control.removeAttribute('aria-describedby');
  }
  if(errors.length){form.insertAdjacentHTML('afterbegin','<p class="notice error form-error" role="alert">Enter the required name, phone and address before continuing.</p>');errors[0].focus();return false;}
  return true;
}
document.addEventListener('change',e=>{if(e.target.id==='demo-person'&&e.target.value){showSkillForm=false;user=e.target.value;screen='sso';modal=null;notice='';render();}});
document.addEventListener('input',e=>{if(e.target.id==='team-search'){search=e.target.value;$('#team-results').innerHTML=teamResults(db.people.filter(p=>p.associate_manager===user));}if(e.target.id==='admin-search'){search=e.target.value;$('#admin-results').innerHTML=adminResults();}});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(!Object.keys(d).length)return;if(d.role){workspace=d.role;search='';render();return;}if(d.task)modal={type:'progress',id:d.task};if(d.assign)modal={type:'assign',id:d.assign};if(d.editroles)modal={type:'roles',id:d.editroles};if(d.reject)modal={type:'reject',id:d.reject};if(d.approve){let r=requests.find(x=>x.id===d.approve);if(r.associate_id===user)return toast('You cannot approve your own request.');r.status='approved';if(r.type==='progress'){let t=db.tasks.find(t=>t.learning_assignment_id===r.target);t.status_percentage=r.value;t.status=r.value===100?'completed':r.value===0?'not_started':'in_progress';t.date_completed=r.value===100?new Date().toISOString().slice(0,10):null;if(r.evidence)t.certificate=r.evidence.url;}else r.value.approval='approved';toast('Request approved.');}
let a=d.action;if(a==='toggle-account'){toggleAccountDrawer();return;}if(a==='close-account'){toggleAccountDrawer(false);return;}if(a==='add-skill')showSkillForm=true;if(a==='cancel-skill')showSkillForm=false;if(a==='activate'||a==='welcome'){screen=a;notice='';}if(a==='sso-success'){enter(user);return;}if(a==='sso-error')notice='Company sign in failed. Try again or cancel.';if(a==='biometric')modal={type:'bio'};if(a==='bio-failure'){modal=null;notice='Biometric verification failed. Try again or use company sign in.';}if(a==='bio-success'){let t=getLogin();modal=null;if(t&&t.expires>Date.now()){enter(t.associate_id);return;}notice='Your session expired. Continue with your company account.';}if(a==='close')modal=null;if(a==='next'){step=Math.min(3,step+1);profile().draftStep=step;}if(a==='back'){step=Math.max(1,step-1);profile().draftStep=step;}if(a==='remove-cv')profile().cv=null;if(a==='save-exit'){try{if(step===1)saveDetailsDraft(document.getElementById('details-form'));profile().draftStep=step;screen='paused';toast('Draft saved for this demo session.');}catch(err){toast(err.message);return;}}if(a==='resume'){screen='onboarding';step=profile().draftStep||1;}if(a==='logout'){logoutApp();}if(a==='expire'){try{localStorage.setItem('talent-prototype-login',JSON.stringify({associate_id:user,expires:0}));}catch{}screen='welcome';notice='Your session expired. Continue with your company account.';}if(a==='reset'){resetData();user=null;screen='welcome';modal=null;notice='Session data reset. Demo login marker retained.';}render();});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target;const formId=f.getAttribute('id');try{const v=new FormData(f);
if(formId==='activate-form'){let p=db.people.find(p=>p.associate_id===v.get('id').trim()&&p.associate_email.toLowerCase()===v.get('email').trim().toLowerCase());if(!p)throw Error('Email and associate ID do not match a dummy account.');user=p.associate_id;screen='sso';notice='';}
if(formId==='details-form'){if(!validateDetails(f,v))return;saveDetailsDraft(f);if(screen==='onboarding'){step=2;profile().draftStep=2;}else toast('Profile saved for this session.');}
if(formId==='skill-form'){let name=v.get('skill').trim();if(!name)throw Error('Enter a skill title.');if(!v.get('description').trim())throw Error('Describe where you used this skill.');if(v.get('years')===null||String(v.get('years')).trim()===''||!Number.isFinite(Number(v.get('years')))||Number(v.get('years'))<0||Number(v.get('years'))>60)throw Error('Enter years of experience between 0 and 60.');if(!v.get('last_used')||v.get('last_used')>new Date().toISOString().slice(0,10))throw Error('Choose a last-used date that is not in the future.');if(person().skills.some(s=>s.approval==='approved'&&s.name.toLowerCase()===name.toLowerCase()))throw Error('This skill is already in your approved skills.');let existing=profile().skills.find(s=>s.name.toLowerCase()===name.toLowerCase()&&s.approval!=='rejected');if(existing)throw Error('This skill already has a submission.');let skill={name,expertise:v.get('expertise'),years:Number(v.get('years')),last_used:v.get('last_used'),description:v.get('description').trim(),proof:upload(v.get('proof')),approval:'pending'};profile().skills.push(skill);requests.push({id:crypto.randomUUID(),type:'skill',associate_id:user,target:name,label:name,value:skill,evidence:skill.proof,status:'pending'});showSkillForm=false;toast('Skill submitted for manager approval.');}
if(formId==='cv-form'){let file=upload(v.get('cv'));if(file)profile().cv=file;if(!profile().cv&&!v.get('skip'))throw Error('Upload a CV or select “I don’t have a CV yet”.');if(screen==='onboarding'){profile().complete=true;screen='dashboard';}toast('Profile saved.');}
if(formId==='progress-form'){let t=db.tasks.find(t=>t.learning_assignment_id===modal.id),value=Number(v.get('progress')),proof=upload(v.get('proof'));if(value===t.status_percentage)throw Error('Choose a different progress value.');if(value===100&&t.certificate_required&&!proof&&!t.certificate)throw Error('Upload a certificate before requesting completion.');requests.push({id:crypto.randomUUID(),type:'progress',associate_id:user,target:t.learning_assignment_id,label:t.subject,value,evidence:proof,status:'pending'});modal=null;toast('Progress submitted for approval.');}
if(formId==='reject-form'){let r=requests.find(r=>r.id===modal.id);r.status='rejected';r.reason=v.get('reason').trim();if(r.type==='skill'){r.value.approval='rejected';r.value.reason=r.reason;}modal=null;toast('Request rejected with feedback.');}
if(formId==='assign-form'){let l=db.learning.find(l=>l.learning_code===v.get('code'));if(db.tasks.some(t=>t.associate_id===modal.id&&t.learning_code===l.learning_code&&t.status!=='completed'))throw Error('This associate already has an active assignment for this learning.');let id='LA-DEMO-'+crypto.randomUUID();db.tasks.push({learning_assignment_id:id,associate_id:modal.id,learning_code:l.learning_code,subject:l.subject,date_assigned:new Date().toISOString().slice(0,10),date_due:v.get('due'),status:'not_started',status_percentage:0,certificate_required:l.certificate_required,description:v.get('description'),assigned_by:user});db.people.find(p=>p.associate_id===modal.id).learning_assignments.push(id);modal=null;toast('Learning assigned.');}
if(formId==='roles-form'){let rr=v.getAll('roles'),old=identity(modal.id);if(!rr.length)throw Error('Keep at least one application role.');if(old.application_roles.includes('admin')&&!rr.includes('admin')&&db.auth.filter(a=>a.application_roles.includes('admin')).length===1)throw Error('The final admin cannot be removed.');if(!rr.includes('manager')&&db.people.some(p=>p.associate_manager===modal.id))throw Error('Reassign direct reports before removing the manager role.');old.application_roles=rr;if(modal.id===user&&!rr.includes(workspace))workspace=rr[0];modal=null;toast('Application roles updated for this session.');}
render();}catch(err){if(modal)$('#modal-error').innerHTML=`<p class="notice error">${esc(err.message)}</p>`;else{let old=f.querySelector('.form-error');if(old)old.remove();f.insertAdjacentHTML('beforeend',`<p class="notice error form-error" role="alert">${esc(err.message)}</p>`);}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('account-drawer-layer')?.classList.contains('is-open')){toggleAccountDrawer(false);return;}if(e.key==='Escape'&&modal){modal=null;render();}if(e.key==='Tab'&&modal){let items=[...document.querySelectorAll('.dialog button,.dialog input,.dialog select,.dialog textarea')].filter(x=>!x.disabled);let first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();

window.addEventListener('resize',positionAccountDrawer);document.addEventListener('scroll',positionAccountDrawer,true);
</script></body></html>
